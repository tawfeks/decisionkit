<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" font-family="Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif" role="img" aria-label="Benchmark bar graph: sessions with DecisionKit use a fraction of the baseline resources across five metrics">
