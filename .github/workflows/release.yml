name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package version $VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build --workspace packages/core
      - name: Publish (trusted publishing, no NPM_TOKEN)
        run: |
          for pkg in core cli pi-ext opencode-plugin kilo-plugin; do
            npm publish --provenance --access public --workspace packages/$pkg
          done